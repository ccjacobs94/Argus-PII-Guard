<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="argus-primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3aba8c" />
      <stop offset="100%" stop-color="#788ee0" />
    </linearGradient>
    <linearGradient id="argus-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ede0c" />
      <stop offset="50%" stop-color="#3aba8c" />
      <stop offset="100%" stop-color="#244684" />
    </linearGradient>
    <radialGradient id="argus-eye-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="60%" stop-color="#1e3a8a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Outline / Base -->
  <path d="M 50 6 C 74 6 92 20 92 48 C 92 72 68 90 50 96 C 32 90 8 72 8 48 C 8 20 26 6 50 6 Z" 
        fill="url(#argus-primary-grad)" fill-opacity="0.15" stroke="url(#argus-primary-grad)" stroke-width="2.5" />

  <!-- Outer Circular Orbit Ring -->
  <ellipse cx="50" cy="48" rx="38" ry="38" fill="none" stroke="url(#argus-ring-grad)" stroke-width="2" stroke-dasharray="7 3" opacity="0.85" />

  <!-- Tilted Concentric Orbit 1 -->
  <ellipse cx="50" cy="48" rx="34" ry="18" fill="none" stroke="#3aba8c" stroke-width="1.8" transform="rotate(-25 50 48)" />

  <!-- Tilted Concentric Orbit 2 -->
  <ellipse cx="50" cy="48" rx="34" ry="18" fill="none" stroke="#788ee0" stroke-width="1.8" transform="rotate(25 50 48)" />

  <!-- Orbit Nodes / Orbital Satellites -->
  <circle cx="24" cy="36" r="2.5" fill="#7ede0c" filter="url(#glow)" />
  <circle cx="76" cy="60" r="2.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="50" cy="18" r="2" fill="#edbeb1" />

  <!-- Eye Shape Outer -->
  <path d="M 22 48 Q 50 24 78 48 Q 50 72 22 48 Z" fill="url(#argus-eye-glow)" stroke="url(#argus-primary-grad)" stroke-width="2" />

  <!-- Eye Iris -->
  <circle cx="50" cy="48" r="12" fill="#0b1938" stroke="#3aba8c" stroke-width="1.5" />
  
  <!-- Eye Pupil & Glowing Core -->
  <circle cx="50" cy="48" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="48" cy="46" r="2" fill="#ffffff" />
</svg>
