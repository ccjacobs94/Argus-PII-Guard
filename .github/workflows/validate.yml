name: Validation & Testing Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    name: Validation & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Step 1: Syntax & Bytecode Compilation"
        run: |
          python -m py_compile backend/main.py backend/scanner.py backend/state.py

      - name: "Step 2: Full Test Suite Execution"
        run: |
          pytest tests/ -v

      - name: "Step 3: Coverage Gate Verification"
        run: |
          pytest --cov=backend --cov-report=term-missing --cov-fail-under=85
